[package]
name = "utokyo-wifi"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
description = "An unofficial command-line tool for Linux to manage connections to the UTokyo Wi-Fi and eduroam networks"
readme = "README.md"
repository = "https://github.com/conjikidow/utokyo-wifi-connector"
license = "MIT OR Apache-2.0"
keywords = ["eduroam", "networkmanager", "nmcli", "utokyo", "wifi"]
categories = ["command-line-utilities"]
include = ["/CHANGELOG.md", "/LICENSE-*", "/README.md", "/src"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
clap_complete = "4.6.12"
ctrlc = "3.5.3"
dialoguer = "0.12.0"
thiserror = "2.0.21"

[profile.dist]
inherits = "release"
lto = "thin"
