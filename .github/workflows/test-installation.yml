name: Test installation

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  test-installation-shell-installer:
    name: Test installation (shell installer)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install utokyo-wifi
        env:
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/utokyo-wifi-installer.sh" | sh

      - name: Check the installed version
        env:
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
        run: |
          expected="utokyo-wifi ${RELEASE_TAG#v}"
          actual="$("${CARGO_HOME:-${HOME}/.cargo}/bin/utokyo-wifi" --version)"
          if [[ ${actual} != "${expected}" ]]; then
            echo "::error title=shell-installer::Expected \`${expected}\`, got \`${actual}\`."
            exit 1
          fi

  test-installation-cargo-binstall:
    name: Test installation (cargo-binstall)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@4b6fa09d0d1ef9740a0c332e31b9ae336f97efa0 # v1.28.0
        with:
          version: '1.28.0'

      - name: Install utokyo-wifi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
        run: cargo binstall --disable-strategies=quick-install,compile --no-confirm "utokyo-wifi@${RELEASE_TAG#v}"

      - name: Check the installed version
        env:
          RELEASE_TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
        run: |
          expected="utokyo-wifi ${RELEASE_TAG#v}"
          actual="$("${CARGO_HOME:-${HOME}/.cargo}/bin/utokyo-wifi" --version)"
          if [[ ${actual} != "${expected}" ]]; then
            echo "::error title=cargo-binstall::Expected \`${expected}\`, got \`${actual}\`."
            exit 1
          fi
